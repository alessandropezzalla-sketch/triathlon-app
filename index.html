<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)">
  <title>Allenamento Triathlon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#f3f5f7; --surface:#ffffff; --surface-alt:#f7f9fb; --border:#dfe5ea; --border-strong:#c6d1da;
      --text:#182129; --muted:#5c6975; --primary:#0f6e8c; --primary-soft:rgba(15,110,140,.12); --primary-text:#fff;
      --corsa:#d9532b; --bici:#1a8f7a; --nuoto:#2f6fd0; --forza:#5a4fa0; --riposo:#8a96a0; --ok:#2e8b4a;
      --warn:#d99018; --danger:#c8364a;
      --z1:#7fa7c4; --z2:#3c9a6b; --z3:#d9a62b; --z4:#e0702f; --z5:#c8364a;
      --bg-ok:rgba(46,139,74,.13); --bg-warn:rgba(217,166,43,.17); --bg-danger:rgba(200,54,74,.14);
      --r:14px; --top:54px;
      --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
      --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0f1419; --surface:#172028; --surface-alt:#1f2a34; --border:#2b3844; --border-strong:#3c4d5d;
        --text:#eef3f7; --muted:#95a6b5; --primary:#2a9ec4; --primary-soft:rgba(42,158,196,.2);
        --bg-ok:rgba(46,139,74,.22); --bg-warn:rgba(217,166,43,.22); --bg-danger:rgba(200,54,74,.24);
      }
    }
    *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{font-size:16px;-webkit-text-size-adjust:100%}
    body{margin:0;font-family:'Barlow',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.4;
      padding:calc(var(--top) + var(--st)) var(--sr) calc(28px + var(--sb)) var(--sl);overflow-x:hidden}
    h1,h2,h3,h4,.ft{font-family:'Barlow Condensed',sans-serif;margin:0;line-height:1.15;letter-spacing:.01em}
    a{color:var(--primary);text-decoration:none}
    button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}

    /* Topbar & Drawer */
    .topbar{position:fixed;top:0;left:0;right:0;height:calc(var(--top) + var(--st));padding:var(--st) calc(12px + var(--sr)) 0 calc(8px + var(--sl));
      background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;z-index:100}
    .menu-btn{width:44px;height:44px;border:none;background:none;border-radius:10px;font-size:22px;cursor:pointer;display:grid;place-items:center}
    .menu-btn:active{background:var(--surface-alt)}
    .top-title{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .backdrop{position:fixed;inset:0;background:rgba(8,14,20,.55);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
    .backdrop.open{opacity:1;pointer-events:auto}
    .drawer{position:fixed;top:0;bottom:0;left:0;width:min(285px,82vw);background:var(--surface);z-index:210;transform:translateX(-100%);
      transition:transform .22s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;
      padding:calc(14px + var(--st)) 0 calc(14px + var(--sb)) var(--sl);box-shadow:4px 0 24px rgba(0,0,0,.2)}
    .drawer.open{transform:translateX(0)}
    .drawer-head{padding:6px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .drawer-head h2{font-size:23px;color:var(--primary)}
    .drawer-nav{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:3px}
    .nav-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;border:none;background:none;
      font-weight:600;font-size:16px;text-align:left;cursor:pointer;min-height:46px;width:100%}
    .nav-item:active{background:var(--surface-alt)}
    .nav-item.active{background:var(--primary-soft);color:var(--primary)}
    .nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
    .drawer-foot{padding:10px 12px 0;border-top:1px solid var(--border);display:flex;gap:8px}

    /* Container & Cards */
    .wrap{max-width:640px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:11px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px}
    .card-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
    .card-hd h2,.card-hd h3{font-size:20px;font-weight:700}

    /* Collapsible */
    .col-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
    .col-btn{width:100%;border:none;background:none;padding:12px 13px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;cursor:pointer;min-height:48px}
    .col-btn:active{background:var(--surface-alt)}
    .col-meta{min-width:0;flex:1}
    .col-t{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700}
    .col-s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
    .col-arr{font-size:15px;color:var(--muted);transition:transform .2s;flex-shrink:0}
    .col-card.open .col-arr{transform:rotate(180deg)}
    .col-body{display:none;padding:11px 13px 13px;border-top:1px solid var(--border)}
    .col-card.open .col-body{display:block}

    /* Buttons, Chips, Alerts */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 14px;border-radius:10px;
      border:1px solid var(--border-strong);background:var(--surface-alt);font-weight:600;font-size:15px;cursor:pointer}
    .btn:active{opacity:.78}
    .btn-p{background:var(--primary);border-color:var(--primary);color:var(--primary-text)}
    .btn-d{background:var(--bg-danger);border-color:var(--danger);color:var(--danger)}
    .btn-sm{min-height:34px;padding:5px 10px;font-size:13px;border-radius:8px}
    .btn-blk{width:100%}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .row-sb{display:flex;gap:8px;align-items:center;justify-content:space-between}
    .chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;
      background:var(--surface-alt);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
    .chip-p{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
    .chip-ok{background:var(--bg-ok);border-color:transparent;color:var(--ok)}
    .chip-w{background:var(--bg-warn);border-color:transparent;color:#996605}
    .chip-d{background:var(--bg-danger);border-color:transparent;color:var(--danger)}
    @media(prefers-color-scheme:dark){.chip-w{color:#f0c458}}
    .alert{padding:10px 12px;border-radius:10px;font-size:14px;border-left:4px solid var(--primary);background:var(--primary-soft)}
    .alert-ok{background:var(--bg-ok);border-left-color:var(--ok)}
    .alert-w{background:var(--bg-warn);border-left-color:var(--warn)}
    .alert-d{background:var(--bg-danger);border-left-color:var(--danger)}
    .alert b{display:block;margin-bottom:2px}
    .muted{color:var(--muted);font-size:13px}
    .sm{font-size:13px}

    /* Forms */
    .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .fld{display:flex;flex-direction:column;gap:3px}
    .fld.full{grid-column:1/-1}
    .fld label{font-size:12px;font-weight:600;color:var(--muted)}
    .fld input,.fld select,.fld textarea{width:100%;min-height:40px;padding:7px 9px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);outline:none}
    .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
    .fld textarea{min-height:74px;resize:vertical}
    .chk{display:flex;align-items:center;gap:8px;min-height:38px;cursor:pointer;font-weight:600;font-size:14px}
    .chk input{width:20px;height:20px;accent-color:var(--primary);flex-shrink:0}
    .alg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
    .alg-it{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface-alt);font-size:13px;cursor:pointer}
    .alg-it input{width:17px;height:17px;accent-color:var(--primary)}

    /* KPIs, Progress, Tables */
    .kpi{background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;padding:9px 6px;text-align:center}
    .kpi-v{font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:700;line-height:1.1}
    .kpi-l{font-size:11px;color:var(--muted);margin-top:2px}
    .pbar{margin-bottom:7px}.pbar:last-child{margin-bottom:0}
    .pbar-h{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:3px}
    .pbar-t{height:8px;border-radius:99px;background:var(--surface-alt);border:1px solid var(--border);overflow:hidden}
    .pbar-f{height:100%;border-radius:99px;background:var(--primary)}
    .tbl{width:100%;border-collapse:collapse;font-size:13px}
    .tbl th,.tbl td{padding:6px 5px;border-bottom:1px solid var(--border);text-align:left}
    .tbl th{color:var(--muted);font-size:12px;font-weight:600}
    .tbl .r{text-align:right}
    .tbl tr:last-child td{border-bottom:none}

    /* Specific widgets */
    .cd-banner{background:linear-gradient(135deg,var(--primary),#0a4e64);color:#fff;border-radius:var(--r);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .cd-t{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700}
    .sem-wrap{display:flex;gap:11px;align-items:flex-start}
    .sem-dot{width:18px;height:18px;border-radius:50%;margin-top:3px;flex-shrink:0}
    .sem-g{background:var(--ok);box-shadow:0 0 0 4px var(--bg-ok)}
    .sem-y{background:var(--warn);box-shadow:0 0 0 4px var(--bg-warn)}
    .sem-r{background:var(--danger);box-shadow:0 0 0 4px var(--bg-danger)}

    .day-card{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--riposo);border-radius:var(--r);padding:11px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
    .day-card:active{background:var(--surface-alt)}
    .day-card.corsa,.day-card.brick{border-left-color:var(--corsa)}
    .day-card.bici{border-left-color:var(--bici)}
    .day-card.nuoto{border-left-color:var(--nuoto)}
    .day-card.forza{border-left-color:var(--forza)}
    .day-card.riposo{border-left-color:var(--riposo)}
    .day-title{font-weight:700;font-size:15px}
    .day-sub{font-size:13px;color:var(--muted);margin-top:2px}

    .macro-bar{height:14px;border-radius:99px;overflow:hidden;display:flex;background:var(--surface-alt);margin:8px 0}
    .mb-c{background:var(--primary)} .mb-p{background:var(--corsa)} .mb-f{background:var(--z3)}
    .meal-card{border:1px solid var(--border);border-radius:12px;padding:11px 12px;background:var(--surface-alt);margin-bottom:9px}
    .meal-card:last-child{margin-bottom:0}
    .ing-list{list-style:none;padding:0;margin:6px 0;font-size:14px}
    .ing-list li{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--border)}
    .ing-list li:last-child{border-bottom:none}

    .filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
    .f-chip{padding:6px 11px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
    .f-chip.active{background:var(--primary);border-color:var(--primary);color:#fff}

    .zone-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;margin-bottom:5px;background:var(--surface-alt);border-left:5px solid var(--z1)}
    .avatar{width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
    .shoe-img{width:58px;height:58px;border-radius:10px;object-fit:cover;background:var(--surface-alt);border:1px solid var(--border);flex-shrink:0}
    .svg-box{width:100%;overflow:hidden}
    .svg-box svg{width:100%;height:auto;display:block}
    .steps-ol{margin:6px 0;padding-left:20px;font-size:14px}
    .steps-ol ul{margin:3px 0;padding-left:18px}

    /* Modal & Toast */
    .modal-bg{position:fixed;inset:0;background:rgba(8,14,20,.58);z-index:300;display:none;align-items:flex-end;justify-content:center}
    .modal-bg.open{display:flex}
    .modal{width:100%;max-width:640px;max-height:92vh;background:var(--surface);border-radius:18px 18px 0 0;
      padding:14px 14px calc(18px + var(--sb));overflow-y:auto;box-shadow:0 -4px 28px rgba(0,0,0,.25)}
    .modal-hd{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:11px;position:sticky;top:-14px;background:var(--surface);padding-top:4px;z-index:2}
    .toast{position:fixed;left:50%;bottom:calc(18px + var(--sb));transform:translateX(-50%) translateY(120px);background:#182129;color:#fff;
      padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:400;transition:transform .22s;pointer-events:none;max-width:90vw;text-align:center}
    .toast.show{transform:translateX(-50%) translateY(0)}
    .mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}
  </style>
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="openDrawerBtn" aria-label="Apri menu">☰</button>

  <div class="backdrop" id="drawerBackdrop"></div>

    <nav class="drawer-nav" id="drawerNav"></nav>

      <input type="file" id="importAllFile" accept=".json,application/json" style="display:none">

  <main class="wrap" id="app"></main>

  <div class="modal-bg" id="modalBg">
    <div class="modal" id="modalBox"></div>

  <div class="toast" id="toast"></div>

// Formatting & Date Utilities
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d=0) => (n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d});
const parseNum = v => { if(v===''||v==null) return null; const n = parseFloat(String(v).replace(',','.')); return isNaN(n)?null:n; };
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const parseISO = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const toISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (iso, n) => { const d=parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); };
const diffDays = (a, b) => Math.round((parseISO(b)-parseISO(a))/86400000);
const getMonday = iso => { const d=parseISO(iso); const day=d.getDay()||7; d.setDate(d.getDate()-(day-1)); return toISO(d); };
const getSunday = iso => { const d=parseISO(iso); const day=d.getDay(); d.setDate(d.getDate()-day); return toISO(d); };
const fmtDateShort = iso => {
  if(!iso) return '—';
  const d=parseISO(iso);
  const gg=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'][d.getDay()];
  const mm=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'][d.getMonth()];
  return `${gg} ${d.getDate()} ${mm}`;
};
const fmtDateFull = iso => {
  if(!iso) return '—';
  const d=parseISO(iso);
  const mm=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'][d.getMonth()];
  return `${d.getDate()} ${mm} ${d.getFullYear()}`;
};
const fmtPace = (min, km) => {
  if(!min||!km||km<=0) return '—';
  const secTotal = Math.round((min*60)/km);
  const m = Math.floor(secTotal/60), s = secTotal%60;
  return `${m}:${String(s).padStart(2,'0')} /km`;
};
const uid = () => Math.random().toString(36).slice(2,10);

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2400);
}

/* ============================================================================
   3. PHYSIOLOGY, SEMAFORO, NUTRITION & PORTION OPTIMIZER ENGINES
   ============================================================================ */
function getEffectiveWeight(){
  if(STATE.weights.length){
    const s=[...STATE.weights].sort((a,b)=>b.date.localeCompare(a.date));
    return s[0].kg;
  }
  if(STATE.bias.length){
    const s=[...STATE.bias].sort((a,b)=>b.date.localeCompare(a.date));
    if(s[0].weight) return s[0].weight;
  }
  return STATE.profile.weight;
}

function getLatestBIA(){
  if(!STATE.bias.length) return null;
  return [...STATE.bias].sort((a,b)=>b.date.localeCompare(a.date))[0];
}

function getEffectiveLeanMass(){
  const bia = getLatestBIA();
  if(bia && bia.leanMass) return bia.leanMass;
  if(STATE.profile.leanMass) return STATE.profile.leanMass;
  const w = getEffectiveWeight();
  const bf = (bia && bia.fatPct!=null) ? bia.fatPct : STATE.profile.bodyFat;
  if(w && bf!=null) return +(w * (1 - bf/100)).toFixed(1);
  return null;
}

function getMaxHR(){
  if(STATE.profile.maxHr) return STATE.profile.maxHr;
  if(STATE.profile.age) return Math.round(208 - 0.7 * STATE.profile.age);
  return null;
}

function getKarvonenZones(){
  const maxHr = getMaxHR(), rhr = STATE.profile.rhr;
  if(!maxHr || !rhr) return null;
  const hrr = maxHr - rhr;
  const pcts = [[.5,.6,'Z1','Recupero','#7fa7c4'],[.6,.7,'Z2','Aerobico base','#3c9a6b'],[.7,.8,'Z3','Tempo / Medio','#d9a62b'],[.8,.9,'Z4','Soglia','#e0702f'],[.9,1,'Z5','VO2max','#c8364a']];
  return pcts.map(([a,b,z,desc,col])=>({z,desc,col,lo:Math.round(rhr+hrr*a),hi:Math.round(rhr+hrr*b),pct:`${Math.round(a*100)}–${Math.round(b*100)}%`}));
}

function findDayPlan(iso){
  for(const w of STATE.weeks){
    const d = (w.days||[]).find(x=>x.date===iso);
    if(d) return d;
  }
  return null;
}

function calcSemaforo(iso){
  const plan = findDayPlan(iso);
  const isRest = !plan || plan.type === 'riposo';
  const sleepMap = Object.fromEntries(STATE.sleep.map(s=>[s.date,s]));
  const tonight = sleepMap[iso];
  if(!tonight) return {color:'none', reasons:[], msg:'Registra il sonno di stanotte nella sezione Sonno per il semaforo del mattino.', isRest};

  let yellows = 0, reds = 0;
  const reasons = [];

  if(tonight.hours < 6){ reds++; reasons.push(`Sonno ${fmt(tonight.hours,1)} h (< 6 h)`); }
  else if(tonight.hours < 7){ yellows++; reasons.push(`Sonno ${fmt(tonight.hours,1)} h (< 7 h)`); }

  if(tonight.quality && tonight.quality <= 2){ yellows++; reasons.push(`Qualità sonno ${tonight.quality}/5`); }

  // RHR vs previous 7 nights (need >= 3)
  if(tonight.rhr){
    const prev = STATE.sleep.filter(s => s.rhr && s.date < iso && diffDays(s.date, iso) <= 7);
    if(prev.length >= 3){
      const avg = prev.reduce((a,b)=>a+b.rhr,0)/prev.length;
      const diff = tonight.rhr - avg;
      if(diff >= 7){ reds++; reasons.push(`FC riposo ${tonight.rhr} bpm (+${fmt(diff,1)} sulla media ${fmt(avg,1)})`); }
      else if(diff >= 5){ yellows++; reasons.push(`FC riposo ${tonight.rhr} bpm (+${fmt(diff,1)} sulla media ${fmt(avg,1)})`); }
    }
  }

  // RPE >= 8 in previous 2 days
  const d1 = addDays(iso,-1), d2 = addDays(iso,-2);
  const hard = [d1,d2].find(d => STATE.logs[d]?.done && STATE.logs[d]?.rpe >= 8);
  if(hard){ yellows++; reasons.push(`Fatica alta (RPE ${STATE.logs[hard].rpe}) il ${fmtDateShort(hard)}`); }

  let color = 'green';
  if(reds >= 1 || yellows >= 2) color = 'red';
  else if(yellows === 1) color = 'yellow';

  let msg;
  if(isRest){
    msg = color==='green' ? 'Giorno di riposo: recupero regolare, mantieni buona idratazione e mobilità leggera.'
        : color==='yellow' ? 'Giorno di riposo utile per recuperare: evita sforzi extra e cura il sonno stasera.'
        : 'Giorno di riposo fondamentale: priorità assoluta a recupero, sonno e alimentazione.';
  } else {
    msg = color==='green' ? 'Allenamento come da piano.'
        : color==='yellow' ? 'Fai la seduta senza superare la FC indicata; se le gambe sono pesanti accorciala.'
        : 'Accorcia di un terzo e resta in Z1–Z2, oppure sposta a domani.';
  }
  return {color, reasons, msg, isRest};
}

function getLongRunWarning(iso, runKm){
  if(!runKm || runKm <= 0) return null;
  // Find longest completed run in last 30 days strictly before iso
  let max30 = 0;
  for(const [d, log] of Object.entries(STATE.logs)){
    if(!log.done || d >= iso) continue;
    const dd = diffDays(d, iso);
    if(dd >= 1 && dd <= 30){
      const plan = findDayPlan(d);
      const rk = (plan?.type === 'brick') ? (log.runKm||0) : (plan?.type === 'corsa' ? (log.km||0) : 0);
      if(rk > max30) max30 = rk;
    }
  }
  if(max30 <= 0) return null;
  const pct = ((runKm - max30) / max30) * 100;
  if(pct > 10) return {pct: Math.round(pct), max30};
  return null;
}

// MET calculations (2024 Adult Compendium)
function runMET(kmh){
  const mph = kmh / 1.60934;
  if(mph <= RUN_MET_PTS[0][0]) return RUN_MET_PTS[0][1];
  for(let i=1;i<RUN_MET_PTS.length;i++){
    const [x0,y0]=RUN_MET_PTS[i-1], [x1,y1]=RUN_MET_PTS[i];
    if(mph <= x1) return y0 + (y1-y0)*((mph-x0)/(x1-x0));
  }
  return RUN_MET_PTS[RUN_MET_PTS.length-1][1];
}
function bikeMET(kmh, intKey){
  if(kmh && kmh > 0){
    if(kmh < 19) return 6.8;
    if(kmh < 22) return 8;
    if(kmh < 26) return 10;
    return 12;
  }
  return {facile:6.8, moderata:8, sostenuta:10, gara:12}[intKey||'moderata'] || 8;
}
function swimMET(intKey){ return {lento:5.8, medio:8, veloce:10.5}[intKey||'medio'] || 8; }
function strMET(intKey){ return {moderata:3.5, intensa:6}[intKey||'moderata'] || 3.5; }

function inferTimingFromTime(t){
  if(!t) return 'mattina_tardi';
  const h = parseInt(t.split(':')[0],10);
  if(isNaN(h)) return 'mattina_tardi';
  if(h < 8) return 'presto';
  if(h < 13) return 'mattina_tardi';
  return 'pomeriggio';
}

function getNutDaySessions(iso){
  const ov = STATE.nutOverrides[iso];
  if(ov) return {...ov, isManual:true};
  const plan = findDayPlan(iso);
  const log = STATE.logs[iso];
  const base = {timing:'none', rest:true, corsa:{dur:0,km:0}, bici:{dur:0,km:0,int:'moderata'}, nuoto:{dur:0,int:'medio'}, forza:{dur:0,int:'moderata'}, isManual:false};
  if(!plan || plan.type === 'riposo') return base;
  base.rest = false;
  base.timing = inferTimingFromTime(plan.time);
  const useLog = log && log.done;
  if(plan.type === 'corsa'){
    base.corsa.dur = useLog ? (log.dur||0) : (plan.dur||0);
    base.corsa.km = useLog ? (log.km||0) : (plan.km||0);
  } else if(plan.type === 'bici'){
    base.bici.dur = useLog ? (log.dur||0) : (plan.dur||0);
    base.bici.km = useLog ? (log.km||0) : (plan.km||0);
  } else if(plan.type === 'nuoto'){
    base.nuoto.dur = useLog ? (log.dur||0) : (plan.dur||0);
  } else if(plan.type === 'forza'){
    base.forza.dur = useLog ? (log.dur||0) : (plan.dur||0);
  } else if(plan.type === 'brick'){
    base.bici.dur = useLog ? (log.bikeDur||0) : (plan.bikeDur || Math.round((plan.dur||0)*0.7));
    base.bici.km = useLog ? (log.bikeKm||0) : (plan.bikeKm||0);
    base.corsa.dur = useLog ? (log.runDur||0) : (plan.runDur || Math.round((plan.dur||0)*0.3));
    base.corsa.km = useLog ? (log.runKm||0) : (plan.km||0);
  }
  return base;
}

function calcNutrition(iso){
  const p = STATE.profile;
  const w = getEffectiveWeight();
  if(!p.sex || !p.age || !w || !p.height) return {missing:true};

  const bia = getLatestBIA();
  const lbm = getEffectiveLeanMass();
  let bmr, bmrSrc;
  if(bia && bia.bmr){ bmr = bia.bmr; bmrSrc = 'Ultima BIA'; }
  else if(lbm){ bmr = 500 + 22 * lbm; bmrSrc = 'Cunningham'; }
  else { bmr = 10*w + 6.25*p.height - 5*p.age + (p.sex==='F' ? -161 : 5); bmrSrc = 'Mifflin–St Jeor'; }

  const act = Number(p.activity) || 1.3;
  const baseTdee = bmr * act;

  const sess = getNutDaySessions(iso);
  let exKcal = 0, loadMin = 0;
  const sessionList = [];
  if(!sess.rest){
    if(sess.corsa.dur > 0){
      const kmh = sess.corsa.km > 0 ? sess.corsa.km / (sess.corsa.dur/60) : 9.5;
      const met = runMET(kmh);
      const kc = Math.max(0, (met - 1) * w * (sess.corsa.dur/60));
      exKcal += kc; loadMin += sess.corsa.dur;
      sessionList.push({disc:'corsa',lbl:'Corsa',dur:sess.corsa.dur,km:sess.corsa.km,kcal:Math.round(kc)});
    }
    if(sess.bici.dur > 0){
      const kmh = sess.bici.km > 0 ? sess.bici.km / (sess.bici.dur/60) : 0;
      const met = bikeMET(kmh, sess.bici.int);
      const kc = Math.max(0, (met - 1) * w * (sess.bici.dur/60));
      exKcal += kc; loadMin += sess.bici.dur;
      sessionList.push({disc:'bici',lbl:'Bici',dur:sess.bici.dur,km:sess.bici.km,kcal:Math.round(kc)});
    }
    if(sess.nuoto.dur > 0){
      const met = swimMET(sess.nuoto.int);
      const kc = Math.max(0, (met - 1) * w * (sess.nuoto.dur/60));
      exKcal += kc; loadMin += sess.nuoto.dur;
      sessionList.push({disc:'nuoto',lbl:'Nuoto',dur:sess.nuoto.dur,km:0,kcal:Math.round(kc)});
    }
    if(sess.forza.dur > 0){
      const met = strMET(sess.forza.int);
      const kc = Math.max(0, (met - 1) * w * (sess.forza.dur/60));
      exKcal += kc; loadMin += sess.forza.dur * 0.5;
      sessionList.push({disc:'forza',lbl:'Rinforzo',dur:sess.forza.dur,km:0,kcal:Math.round(kc)});
    }
  }

  const goalMult = p.nutGoal==='lose' ? 0.9 : p.nutGoal==='gain' ? 1.1 : 1.0;
  let calcKcal = Math.round((baseTdee + exKcal) * goalMult);
  let targetKcal = calcKcal, capDiff = 0;
  if(p.kcalCap && p.kcalCap > 0 && p.kcalCap < calcKcal){
    capDiff = calcKcal - p.kcalCap;
    targetKcal = Math.round(p.kcalCap);
  }

  // Carb load tier
  let carbRange, loadLabel;
  if(loadMin <= 45){ carbRange=[3,5]; loadLabel='Leggero'; }
  else if(loadMin <= 90){ carbRange=[5,7]; loadLabel='Moderato'; }
  else if(loadMin <= 180){ carbRange=[6,10]; loadLabel='Endurance'; }
  else if(loadMin <= 270){ carbRange=[7,10]; loadLabel='Endurance alto'; }
  else { carbRange=[8,12]; loadLabel='Molto alto'; }

  const protGkg = p.nutGoal === 'lose' ? 1.8 : 1.6;
  const protG = Math.round(protGkg * w);
  let fatKcal = targetKcal * 0.25;
  let carbKcal = targetKcal - protG*4 - fatKcal;
  let carbG = Math.round(carbKcal / 4);
  let fatG = Math.round(fatKcal / 9);
  const minCarbG = Math.round(carbRange[0] * w), maxCarbG = Math.round(carbRange[1] * w);
  let macroNote = '';

  if(carbG > maxCarbG){
    const excessKcal = (carbG - maxCarbG) * 4;
    const maxFatKcal = targetKcal * 0.35;
    const newFatKcal = Math.min(maxFatKcal, fatKcal + excessKcal);
    fatG = Math.round(newFatKcal / 9);
    carbG = Math.round((targetKcal - protG*4 - newFatKcal) / 4);
    macroNote = `Carboidrati limitati al tetto del giorno (${carbRange[1]} g/kg): quota extra spostata sui grassi (fino al 35%).`;
  } else if(carbG < minCarbG){
    const neededKcal = (minCarbG - carbG) * 4;
    const minFatKcal = targetKcal * 0.20;
    const newFatKcal = Math.max(minFatKcal, fatKcal - neededKcal);
    fatG = Math.round(newFatKcal / 9);
    carbG = Math.max(0, Math.round((targetKcal - protG*4 - newFatKcal) / 4));
    macroNote = `Grassi ridotti verso il 20% per avvicinare i carboidrati al minimo del carico (${carbRange[0]} g/kg).`;
  }

  const ea = lbm ? +((targetKcal - exKcal) / lbm).toFixed(1) : null;
  return {
    missing:false, w, lbm, bmr:Math.round(bmr), bmrSrc, exKcal:Math.round(exKcal),
    calcKcal, targetKcal, capDiff, loadMin, loadLabel, carbRange,
    c:carbG, p:protG, f:fatG, protGkg, macroNote, ea, sess, sessionList
  };
}

// Recipe resolver & weighted least squares portion optimizer
function resolveRecipe(rec, userAllergens){
  const algSet = new Set(userAllergens||[]);
  const resolved = [];
  for(const ing of rec.ings){
    const chosenId = ing.o.find(id => !FOODS[id].alg.some(a => algSet.has(a)));
    if(!chosenId) return null;
    resolved.push({...ing, food: FOODS[chosenId]});
  }
  return {...rec, resolved};
}

function roundQty(food, grams){
  if(grams <= 0) return 0;
  if(food.unit === 'egg') return Math.max(55, Math.round(grams/55)*55);
  if(food.unit === 'oil') return Math.round(grams/10)*10;
  if(food.unit === 'ml') return Math.round(grams/10)*10;
  if(grams >= 100) return Math.round(grams/10)*10;
  return Math.round(grams/5)*5;
}

function formatQty(food, grams){
  if(food.unit === 'egg'){
    const n = Math.max(1, Math.round(grams/55));
    return `${n} ${n===1?'uovo':'uova'} (${n*55} g)`;
  }
  if(food.unit === 'oil'){
    const c = Math.round(grams/10);
    return `${c} ${c===1?'cucchiaio':'cucchiai'} (${grams} g)`;
  }
  if(food.unit === 'ml') return `${grams} ml`;
  return `${grams} g`;
}

function solvePortions(rec, target, hunger, dayKcal){
  const vegBase = hunger==='tanta' ? 300 : hunger==='poca' ? 150 : 200;
  const maxScale = dayKcal > 2800 ? dayKcal / 2800 : 1;

  // Fixed nutrients
  let fc=0, fp=0, ff=0;
  const vars = [];
  const fixedItems = [];
  for(const ing of rec.resolved){
    if(ing.fix){
      const q = ing.fix;
      fixedItems.push({ing, q});
      fc += ing.food.c * q / 100; fp += ing.food.p * q / 100; ff += ing.food.f * q / 100;
    } else if(ing.veg){
      const q = Math.round((vegBase * ing.veg)/10)*10;
      fixedItems.push({ing, q});
      fc += ing.food.c * q / 100; fp += ing.food.p * q / 100; ff += ing.food.f * q / 100;
    } else {
      const mx = Math.round(ing.max * maxScale);
      const mn = ing.min;
      vars.push({ing, mn, mx, q: (mn+mx)/2});
    }
  }

  // Coordinate descent on weighted least squares in kcal space: (4*dC)^2 + (4*dP)^2 + (9*dF)^2
  const remC = target.c - fc, remP = target.p - fp, remF = target.f - ff;
  for(let iter=0; iter<35; iter++){
    for(let i=0; i<vars.length; i++){
      let oc=0, op=0, of=0;
      for(let j=0; j<vars.length; j++){
        if(j===i) continue;
        const f = vars[j].ing.food, q = vars[j].q / 100;
        oc += f.c*q; op += f.p*q; of += f.f*q;
      }
      const f = vars[i].ing.food;
      const ac = 4*f.c/100, ap = 4*f.p/100, af = 9*f.f/100;
      const bc = 4*(remC - oc), bp = 4*(remP - op), bf = 9*(remF - of);
      const denom = ac*ac + ap*ap + af*af;
      if(denom > 1e-6){
        let q = (ac*bc + ap*bp + af*bf) / denom;
        vars[i].q = Math.max(vars[i].mn, Math.min(vars[i].mx, q));
      }
    }
  }

  // Build final rounded items
  const items = [];
  const roleNames = {};
  for(const it of fixedItems){
    items.push({role:it.ing.r, food:it.ing.food, q:it.q});
    if(it.ing.r==='fix') roleNames.fix = it.ing.food.short;
  }
  for(const v of vars){
    let rq = roundQty(v.ing.food, v.q);
    if(v.mn > 0 && rq < v.mn) rq = roundQty(v.ing.food, v.mn);
    if(rq > 0){
      items.push({role:v.ing.r, food:v.ing.food, q:rq});
      roleNames[v.ing.r] = v.ing.food.short;
    }
  }

  // Dynamic title cleanup when a variable ingredient is 0g
  let title = rec.t;
  for(const k of ['carb','prot','fat','fix']){
    if(roleNames[k]) title = title.replace(`{${k}}`, roleNames[k]);
    else {
      title = title.replace(new RegExp(`,?\\s*e\\s*\\{${k}\\}`, 'gi'), '')
                   .replace(new RegExp(`\\{${k}\\},?\\s*(e\\s*)?`, 'gi'), '')
                   .replace(new RegExp(`\\s+con\\s*$`, 'i'), '');
    }
  }
  title = title.replace(/\s+,/g,',').replace(/\s{2,}/g,' ').replace(/^,\s*/,'').trim();
  title = title.charAt(0).toUpperCase() + title.slice(1);

  const tot = {kcal:0,c:0,p:0,f:0,fib:0};
  for(const it of items){
    tot.kcal += it.food.kcal * it.q / 100;
    tot.c += it.food.c * it.q / 100;
    tot.p += it.food.p * it.q / 100;
    tot.f += it.food.f * it.q / 100;
    tot.fib += it.food.fib * it.q / 100;
  }
  return {title, items, tot:{kcal:Math.round(tot.kcal), c:Math.round(tot.c), p:Math.round(tot.p), f:Math.round(tot.f), fib:Math.round(tot.fib)}, prep:rec.prep};
}

function buildMealSlots(nut){
  const p = STATE.profile;
  const nMeals = p.mealsCount || (p.hunger==='tanta' ? 5 : 4);
  let slots;
  if(nMeals === 3) slots = [{id:'col',lbl:'Colazione',type:'col',pct:.25},{id:'pranzo',lbl:'Pranzo',type:'main',pct:.40},{id:'cena',lbl:'Cena',type:'main',pct:.35}];
  else if(nMeals === 5) slots = [{id:'col',lbl:'Colazione',type:'col',pct:.22},{id:'spu1',lbl:'Spuntino mattina',type:'spu',pct:.10},{id:'pranzo',lbl:'Pranzo',type:'main',pct:.30},{id:'spu2',lbl:'Spuntino pomeriggio',type:'spu',pct:.10},{id:'cena',lbl:'Cena',type:'main',pct:.28}];
  else slots = [{id:'col',lbl:'Colazione',type:'col',pct:.25},{id:'pranzo',lbl:'Pranzo',type:'main',pct:.32},{id:'spu2',lbl:'Spuntino pomeriggio',type:'spu',pct:.13},{id:'cena',lbl:'Cena',type:'main',pct:.30}];

  // Determine pre & post workout slots
  const timing = nut.sess.rest ? 'none' : nut.sess.timing;
  let preId = null, postId = null;
  if(timing === 'presto'){ postId = 'col'; }
  else if(timing === 'mattina_tardi'){ preId = 'col'; postId = 'pranzo'; }
  else if(timing === 'pomeriggio'){ preId = slots.some(s=>s.id==='spu2') ? 'spu2' : 'pranzo'; postId = 'cena'; }

  // Allocate target macros per slot
  return slots.map(s => {
    let c = nut.c * s.pct, pr = nut.p * s.pct, f = nut.f * s.pct;
    const isPre = s.id === preId, isPost = s.id === postId;
    if(isPre){
      const movedFatKcal = (f * 0.5) * 9;
      f = f * 0.5;
      c = c + movedFatKcal / 4;
    }
    if(isPost){
      pr = Math.max(pr, 0.25 * nut.w);
    }
    return {...s, isPre, isPost, target:{c, p:pr, f, kcal:Math.round(c*4+pr*4+f*9)}};
  });
}

function getEligibleRecipes(slot){
  const p = STATE.profile;
  const maxCook = Number(p.cook ?? 1);
  let list = RECIPES.filter(r => r.type === slot.type && r.cook <= maxCook)
                    .map(r => resolveRecipe(r, p.allergens))
                    .filter(Boolean);
  if(slot.isPre){
    const preOnly = list.filter(r => r.pre);
    if(preOnly.length) list = preOnly;
  }
  // Sort by hunger preference & post-workout preference
  list.sort((a,b) => {
    if(slot.isPost && (b.post?1:0)!==(a.post?1:0)) return (b.post?1:0)-(a.post?1:0);
    if(p.hunger === 'tanta') return b.sat - a.sat;
    if(p.hunger === 'poca') return a.sat - b.sat;
    return 0;
  });
  return list;
}

/* ============================================================================
   4. SVG CHART GENERATORS
   ============================================================================ */
function svgStackedWeeks(weeksData){
  const W=340, H=175, pl=34, pr=8, pt=22, pb=26;
  const maxVal = Math.max(60, ...weeksData.map(w=>w.tot));
  const step = Math.ceil(maxVal / 3 / 30) * 30 || 30;
  const yMax = step * 3;
  const cw = (W-pl-pr)/weeksData.length;
  const bw = Math.min(28, cw*0.64);
  let out = `<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=3;i++){
    const v = step*i, y = H-pb - (v/yMax)*(H-pt-pb);
    out += `<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="var(--border)" stroke-dasharray="2,3"/>`;
    out += `<text x="${pl-5}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--muted)">${v}</text>`;
  }
  const cols = [['corsa','#d9532b'],['bici','#1a8f7a'],['nuoto','#2f6fd0'],['forza','#5a4fa0']];
  weeksData.forEach((w, idx) => {
    const x = pl + idx*cw + (cw-bw)/2;
    let curY = H-pb;
    cols.forEach(([k,c]) => {
      const v = w[k]||0; if(!v) return;
      const h = (v/yMax)*(H-pt-pb);
      curY -= h;
      out += `<rect x="${x}" y="${curY}" width="${bw}" height="${h}" fill="${c}" rx="2"/>`;
    });
    if(w.tot>0) out += `<text x="${x+bw/2}" y="${curY-4}" text-anchor="middle" font-size="9" font-weight="700" fill="var(--text)">${w.tot}</text>`;
    out += `<text x="${x+bw/2}" y="${H-9}" text-anchor="middle" font-size="9" fill="var(--muted)">${w.lbl}</text>`;
  });
  out += `</svg>`;
  return out;
}

function svgBarChart(items, opts){
  const W=340, H=155, pl=28, pr=10, pt=20, pb=24;
  const yMax = Math.max(opts.minMax||8, ...items.map(i=>i.val));
  const cw = (W-pl-pr)/items.length;
  const bw = Math.min(26, cw*0.68);
  let out = `<svg viewBox="0 0 ${W} ${H}">`;
  if(opts.target){
    const ty = H-pb - (opts.target/yMax)*(H-pt-pb);
    out += `<line x1="${pl}" y1="${ty}" x2="${W-pr}" y2="${ty}" stroke="var(--primary)" stroke-width="1.4" stroke-dasharray="4,3"/>`;
    out += `<text x="${W-pr}" y="${ty-4}" text-anchor="end" font-size="9" font-weight="700" fill="var(--primary)">${opts.targetLbl}</text>`;
  }
  items.forEach((it, idx) => {
    const x = pl + idx*cw + (cw-bw)/2;
    const h = Math.max(0, (it.val/yMax)*(H-pt-pb));
    const y = H-pb-h;
    if(it.val>0){
      out += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${it.col}" rx="3"/>`;
      out += `<text x="${x+bw/2}" y="${y-3}" text-anchor="middle" font-size="9" font-weight="600" fill="var(--text)">${opts.dec?fmt(it.val,1):it.val}</text>`;
    }
    out += `<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="8.5" fill="var(--muted)">${it.lbl}</text>`;
  });
  out += `</svg>`;
  return out;
}

function svgLineChart(points, unit){
  if(!points.length) return `<div class="muted">Nessun dato registrato.</div>`;
  const W=340, H=150, pl=38, pr=16, pt=18, pb=24;
  const vals = points.map(p=>p.v);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  if(mn===mx){ mn-=1; mx+=1; }
  const pad = (mx-mn)*0.15; mn-=pad; mx+=pad;
  const xPos = i => points.length===1 ? (pl+W-pr)/2 : pl + (i/(points.length-1))*(W-pl-pr);
  const yPos = v => H-pb - ((v-mn)/(mx-mn))*(H-pt-pb);
  let out = `<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=2;i++){
    const v = mn + (mx-mn)*(i/2), y = yPos(v);
    out += `<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="var(--border)" stroke-dasharray="2,3"/>`;
    out += `<text x="${pl-5}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--muted)">${fmt(v,1)}${unit}</text>`;
  }
  if(points.length>1){
    const d = points.map((p,i)=>`${i===0?'M':'L'}${xPos(i).toFixed(1)},${yPos(p.v).toFixed(1)}`).join(' ');
    out += `<path d="${d}" fill="none" stroke="var(--primary)" stroke-width="2.2" stroke-linejoin="round"/>`;
  }
  points.forEach((p,i)=>{
    const x=xPos(i), y=yPos(p.v), isLast=i===points.length-1;
    out += `<circle cx="${x}" cy="${y}" r="${isLast?4.8:3}" fill="${isLast?'var(--corsa)':'var(--primary)'}" stroke="var(--surface)" stroke-width="1.5"/>`;
    if(isLast) out += `<text x="${Math.min(W-14,x)}" y="${y-8}" text-anchor="${x>W-45?'end':'middle'}" font-size="10" font-weight="700" fill="var(--corsa)">${fmt(p.v,1)}${unit}</text>`;
    if(i===0 || isLast || (points.length>4 && i===Math.floor(points.length/2))){
      out += `<text x="${x}" y="${H-8}" text-anchor="middle" font-size="8.5" fill="var(--muted)">${p.lbl}</text>`;
    }
  });
  out += `</svg>`;
  return out;
}

function initNav(){
  $('#drawerNav').innerHTML = NAV_ITEMS.map(n=>`
    <button class="nav-item" data-route="${n.id}">
      <svg viewBox="0 0 24 24">${n.ico}</svg>${n.lbl}
    </button>`).join('');
  $('#drawerNav').addEventListener('click', e => {
    const btn = e.target.closest('.nav-item');
    if(!btn) return;
    location.hash = '#' + btn.dataset.route;
    closeDrawer();
  });
  $('#openDrawerBtn').onclick = openDrawer;
  $('#closeDrawerBtn').onclick = closeDrawer;
  $('#drawerBackdrop').onclick = closeDrawer;
  $('#modalBg').addEventListener('click', e => { if(e.target===$('#modalBg')) closeModal(); });
  document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeDrawer(); closeModal(); } });
  window.addEventListener('hashchange', syncRoute);
  syncRoute();
}

function openDrawer(){ $('#drawer').classList.add('open'); $('#drawerBackdrop').classList.add('open'); }
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#drawerBackdrop').classList.remove('open'); }
function openModal(html){ $('#modalBox').innerHTML = html; $('#modalBg').classList.add('open'); }
function closeModal(){ $('#modalBg').classList.remove('open'); }

function syncRoute(){
  const h = (location.hash||'#settimana').replace('#','').toLowerCase();
  const valid = NAV_ITEMS.find(n=>n.id===h);
  currentRoute = valid ? valid.id : 'settimana';
  $('#topbarTitle').textContent = (valid || NAV_ITEMS[0]).lbl;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.route === currentRoute));
  render();
  window.scrollTo(0,0);
}

function toggleCol(btn){ btn.closest('.col-card').classList.toggle('open'); }

function render(){
  const views = {
    settimana: renderSettimana, storico: renderStorico, nutrizione: renderNutrizione,
    guida: renderGuida, sonno: renderSonno, gare: renderGare, profilo: renderProfilo

}

function changeWeek(delta){
  selectedWeekIdx = Math.max(0, Math.min(STATE.weeks.length-1, selectedWeekIdx+delta));
  render();
}

function saveWeekFeedback(start){
  STATE.feedback[start] = $('#weekFeedbackTxt').value.trim();
  saveState(); toast('Feedback settimana salvato');
}

function renderSteps(steps){
  if(!steps || !steps.length) return '';
  let html = '<ol class="steps-ol">';
  for(let i=0;i<steps.length;i++){
    if(Array.isArray(steps[i])) continue;
    html += `<li>${esc(steps[i])}`;
    if(Array.isArray(steps[i+1])){
      html += `<ul>${steps[i+1].map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;
    }
    html += `</li>`;
  }
  return html + '</ol>';
}

function updModalPace(){
  const box = $('#mPaceBox'); if(!box) return;
  if($('#mBikeDur')){
    const bd = parseNum($('#mBikeDur').value)||0, rd = parseNum($('#mRunDur').value)||0, rk = parseNum($('#mRunKm').value)||0;
    box.textContent = `Durata totale: ${bd+rd} min · Passo corsa: ${fmtPace(rd, rk)}`;
  } else {
    box.textContent = `Passo: ${fmtPace(parseNum($('#mDur').value), parseNum($('#mKm').value))}`;
  }
}

function saveDayLog(iso, type){
  const isBrick = type==='brick';
  const rec = {
    done: $('#mDone').checked,
    rpe: Number($('#mRpe').value),
    notes: $('#mNotes').value.trim(),
    shoeId: $('#mShoe') ? $('#mShoe').value : ''
  };
  if(isBrick){
    rec.bikeKm = parseNum($('#mBikeKm').value)||0;
    rec.bikeDur = parseNum($('#mBikeDur').value)||0;
    rec.runDur = parseNum($('#mRunDur').value)||0;
    rec.runKm = parseNum($('#mRunKm').value)||0;
    rec.dur = rec.bikeDur + rec.runDur;
  } else {
    rec.dur = parseNum($('#mDur').value)||0;
    rec.km = parseNum($('#mKm').value)||0;
  }
  STATE.logs[iso] = rec;
  saveState(); closeModal(); render(); toast('Seduta salvata');
}

function openImportWeekModal(){
  const sample = JSON.stringify({start:addDays(getMonday(todayISO()),7),title:"Settimana prossima",note:"",days:[{date:addDays(getMonday(todayISO()),7),type:"corsa",title:"Corsa facile",time:"07:00",dur:40,km:6.5,fc:"Z2",rpe:4,meteo:"",impegni:"",steps:["10 min Z1","30 min Z2"]}]},null,2);
  openModal(`

      <textarea id="impWkTxt" style="min-height:170px;font-family:monospace;font-size:13px" placeholder='${esc(sample)}'></textarea>
    </div>
    <button class="btn btn-p btn-blk mt12" onclick="doImportWeek()">Importa settimana</button>
  `);
}

function doImportWeek(){
  try {
    const obj = JSON.parse($('#impWkTxt').value.trim());
    const arr = Array.isArray(obj) ? obj : [obj];
    arr.forEach(w => {
      if(!w.start || !Array.isArray(w.days)) throw new Error();
      const idx = STATE.weeks.findIndex(x=>x.start===w.start);
      if(idx>=0) STATE.weeks[idx] = w; else STATE.weeks.push(w);
    });
    STATE.weeks.sort((a,b)=>a.start.localeCompare(b.start));
    selectedWeekIdx = STATE.weeks.length - 1;
    saveState(); closeModal(); render(); toast('Settimana importata');
  } catch(e){ toast('JSON non valido: controlla la sintassi'); }
}

/* ============================================================================
   7. SECTION 2: STORICO
   ============================================================================ */
function renderStorico(){
  const entries = Object.entries(STATE.logs).filter(([,l])=>l.done).map(([date,log])=>{
    const plan = findDayPlan(date) || {type:'corsa', title:'Seduta'};
    const dur = plan.type==='brick' ? ((log.bikeDur||0)+(log.runDur||0)) : (log.dur||0);
    const runKm = plan.type==='corsa' ? (log.km||0) : plan.type==='brick' ? (log.runKm||0) : 0;
    return {date, log, plan, dur, runKm};
  }).sort((a,b)=>b.date.localeCompare(a.date));

  const totSess = entries.length;
  const totRunKm = entries.reduce((a,e)=>a+e.runKm,0);
  const totHrs = entries.reduce((a,e)=>a+e.dur,0)/60;

  // Last 8 Mondays
  const curMon = getMonday(todayISO());
  const weeks8 = [];
  for(let i=7;i>=0;i--){
    const mon = addDays(curMon, -i*7);
    const sun = addDays(mon, 6);
    const bucket = {mon, lbl:mon.slice(8)+'/'+mon.slice(5,7), corsa:0, bici:0, nuoto:0, forza:0, tot:0};
    entries.filter(e=>e.date>=mon && e.date<=sun).forEach(e=>{
      const t = e.plan.type;
      if(t==='brick'){ bucket.bici += (e.log.bikeDur||0); bucket.corsa += (e.log.runDur||0); }
      else if(bucket[t]!=null) bucket[t] += e.dur;
    });
    bucket.tot = bucket.corsa + bucket.bici + bucket.nuoto + bucket.forza;
    weeks8.push(bucket);
  }

  // Group by week Monday
  const grouped = {};
  entries.forEach(e => { const m = getMonday(e.date); (grouped[m] = grouped[m]||[]).push(e); });
  const listHtml = Object.keys(grouped).sort().reverse().map(mon => `
    <div class="card">
      <div class="card-hd"><h3>Settimana del ${fmtDateFull(mon)}</h3><span class="chip">${grouped[mon].length} sedute</span></div>
      ${grouped[mon].map(e => {
        const kmStr = e.plan.type==='brick' ? `${fmt(e.log.bikeKm||0,1)} km bici + ${fmt(e.log.runKm||0,1)} km corsa`
                    : (e.log.km ? `${fmt(e.log.km,1)} km` : '');
        const paceStr = e.plan.type==='corsa' ? fmtPace(e.log.dur, e.log.km)
                      : e.plan.type==='brick' ? fmtPace(e.log.runDur, e.log.runKm) : '';
        return `<div style="padding:8px 0;border-bottom:1px solid var(--border)">
          <div class="row-sb"><b>${fmtDateShort(e.date)} · ${esc(e.plan.title)}</b><span class="chip">RPE ${e.log.rpe||'—'}</span></div>
          <div class="muted">${[e.dur?`${e.dur} min`:'', kmStr, paceStr!=='—'?paceStr:''].filter(Boolean).join(' · ')}</div>
          ${e.log.notes?`<div class="sm mt8">${esc(e.log.notes)}</div>`:''}
        </div>`;
      }).join('')}
    </div>`).join('') || `<div class="card muted">Nessuna seduta registrata finora.</div>`;

  return `
    <div class="g3">
      <div class="kpi"><div class="kpi-v">${totSess}</div><div class="kpi-l">Sedute fatte</div></div>
      <div class="kpi"><div class="kpi-v" style="color:var(--corsa)">${fmt(totRunKm,1)}</div><div class="kpi-l">Km corsa</div></div>
      <div class="kpi"><div class="kpi-v" style="color:var(--primary)">${fmt(totHrs,1)}</div><div class="kpi-l">Ore totali</div></div>
    </div>
    <div class="card">
      <div class="card-hd"><h3>Minuti per disciplina (ultime 8 settimane)</h3></div>
      <div class="svg-box">${svgStackedWeeks(weeks8)}</div>
      <div class="row mt8" style="justify-content:center;font-size:12px">
        <span><b style="color:var(--corsa)">■</b> Corsa</span>
        <span><b style="color:var(--bici)">■</b> Bici</span>
        <span><b style="color:var(--nuoto)">■</b> Nuoto</span>
        <span><b style="color:var(--forza)">■</b> Rinforzo</span>
      </div>
    </div>
    ${listHtml}`;
}

function renderNutrizione(){

  const sess = getNutDaySessions(iso);

  // Closed summary for daily workouts

  const workoutsBox = `<div class="col-card">

          </select>
        </div>
      </div>
      <label class="chk mb8"><input type="checkbox" ${sess.rest?'checked':''} onchange="updNutSess('rest',this.checked)"> Riposo</label>
      ${!sess.rest ? `
        <div class="g2 mb8">
          <div class="fld"><label>Corsa (min)</label><input type="number" value="${sess.corsa.dur||''}" onchange="updNutSess('corsa.dur',this.value)"></div>
          <div class="fld"><label>Corsa (km) ${sess.corsa.dur&&sess.corsa.km?`· ${fmtPace(sess.corsa.dur,sess.corsa.km)}`:''}</label><input type="number" step="0.1" value="${sess.corsa.km||''}" onchange="updNutSess('corsa.km',this.value)"></div>
          <div class="fld"><label>Bici (min)</label><input type="number" value="${sess.bici.dur||''}" onchange="updNutSess('bici.dur',this.value)"></div>
          <div class="fld"><label>Bici (km) ${bikeKmh?`· ${fmt(bikeKmh,1)} km/h`:''}</label><input type="number" step="0.1" value="${sess.bici.km||''}" onchange="updNutSess('bici.km',this.value)"></div>
          ${!sess.bici.km ? `<div class="fld full"><label>Intensità bici</label>

                    : `<div class="muted mb8">Inserisci i valori stimati (inserimento manuale attivo):</div>`}
          <div class="g3 mb8">
            <div class="fld"><label>Kcal</label><input type="number" id="chK_${slot.id}" value="${cheat.kcal||''}"></div>
            <div class="fld"><label>Carbo (g)</label><input type="number" id="chC_${slot.id}" value="${cheat.c||''}"></div>
            <div class="fld"><label>Prot (g)</label><input type="number" id="chP_${slot.id}" value="${cheat.p||''}"></div>
            <div class="fld"><label>Grassi (g)</label><input type="number" id="chF_${slot.id}" value="${cheat.f||''}"></div>
            <div class="fld"><label>Fibre (g)</label><input type="number" id="chFib_${slot.id}" value="${cheat.fib||''}"></div>
          </div>
          <button class="btn btn-p btn-sm" onclick="saveCheatManual('${iso}','${slot.id}')">Salva valori pasto</button>
        </div>`;
      }

      let eligible = getEligibleRecipes(slot);
      if(slot.id === 'cena' && usedLunchId && eligible.length > 1){
        eligible = eligible.filter(r => r.id !== usedLunchId);
      }
      if(!eligible.length){
        return `<div class="meal-card"><b>${slot.lbl}</b><div class="muted">Nessuna ricetta compatibile con filtri/allergie.</div></div>`;
      }
      let chosenId = STATE.mealChoices[iso][slot.id];
      let rec = eligible.find(r => r.id === chosenId) || eligible[0];
      if(slot.id === 'pranzo') usedLunchId = rec.id;
      if(STATE.mealChoices[iso][slot.id] !== rec.id){ STATE.mealChoices[iso][slot.id] = rec.id; saveState(); }

      const solved = solvePortions(rec, slot.target, STATE.profile.hunger, nut.targetKcal);
      planTot.kcal += solved.tot.kcal; planTot.c += solved.tot.c; planTot.p += solved.tot.p; planTot.f += solved.tot.f; planTot.fib += solved.tot.fib;

      return `<div class="meal-card">
        <div class="row-sb">
          <div class="row" style="gap:5px">
            <span class="chip chip-p">${slot.lbl}</span>
            ${slot.isPre?'<span class="chip chip-w">Prima dell\'allenamento: pochi grassi e fibre</span>':''}
            ${slot.isPost?'<span class="chip chip-ok">Dopo l\'allenamento</span>':''}
          </div>
          <b class="ft" style="font-size:19px">${solved.tot.kcal} kcal</b>
        </div>
        <div style="font-weight:700;font-size:16px;margin-top:5px">${esc(solved.title)}</div>
        <ul class="ing-list">${solved.items.map(it=>`<li><span>${esc(it.food.name)}</span><b>${formatQty(it.food, it.q)}</b></li>`).join('')}</ul>
        <div class="muted sm">C ${solved.tot.c} g · P ${solved.tot.p} g · G ${solved.tot.f} g · Fibre ${solved.tot.fib} g</div>
        ${solved.prep?`<div class="sm mt8">${esc(solved.prep)}</div>`:''}
        <div class="row mt8">
          <button class="btn btn-sm" onclick="nextRecipe('${iso}','${slot.id}',${rec.id})">Un'altra idea</button>
          ${(slot.id==='pranzo'||slot.id==='cena')?`<button class="btn btn-sm" onclick="startCheat('${iso}','${slot.id}')">Pasto sgarro</button>`:''}
        </div>
      </div>`;
    }).join('');

    // During sessions advice
    const sweatAvg = calcSweatAvg();
    const duringHtml = nut.sessionList.length ? `<div class="card">
      <div class="card-hd"><h3>Durante le sedute</h3></div>
      ${nut.sessionList.map(s => {
        const cAdv = s.dur<=45 ? 'Non servono carboidrati durante.' : s.dur<=75 ? 'Piccole quantità o sciacqui di bocca.' : s.dur<=150 ? '30–60 g/h di carboidrati.' : 'Fino a 90 g/h (glucosio + fruttosio).';
        let fAdv = 'Bevi a sete.';
        if(s.dur > 60){
          if(sweatAvg.byDisc[s.disc]){
            const rateMl = Math.round(sweatAvg.byDisc[s.disc]*1000);
            const maxLossMl = nut.w * 20; // 2% weight in ml
            const needMlH = Math.max(300, Math.round(rateMl - maxLossMl/(s.dur/60)));
            fAdv = `~${needMlH} ml/h (sudore medio ${fmt(sweatAvg.byDisc[s.disc],2)} L/h) per perdere < 2% del peso.`;
          } else fAdv = '400–800 ml/h (registra il sudore per una stima personalizzata).';
        }
        return `<div style="padding:8px 0;border-bottom:1px solid var(--border)">
          <div class="row-sb"><b>${s.lbl} · ${s.dur} min</b><span class="chip">${s.kcal} kcal</span></div>

          ${s.dur>60?`<div class="sm">• <b>Prima:</b> ${Math.round(nut.w)}–${Math.round(nut.w*2)} g carboidrati 1–2 ore prima.</div>`:''}
        </div>`;
      }).join('')}
    </div>` : '';

    const cheatDiff = planTot.kcal - nut.targetKcal;

    mainNutHtml = `
      <div class="card">
        <div class="card-hd"><h3>Fabbisogno del giorno</h3><span class="chip">${nut.loadLabel}</span></div>
        <div class="g3 mb8">
          <div class="kpi"><div class="kpi-v" style="color:var(--primary)">${fmt(nut.targetKcal)}</div><div class="kpi-l">Kcal totali</div></div>
          <div class="kpi"><div class="kpi-v">${fmt(nut.bmr)}</div><div class="kpi-l">BMR (${nut.bmrSrc})</div></div>
          <div class="kpi"><div class="kpi-v" style="color:var(--corsa)">+${fmt(nut.exKcal)}</div><div class="kpi-l">Allenamento</div></div>
        </div>
        ${nut.capDiff>0 ? `<div class="alert alert-w mb8"><b>Tetto calorie attivo (-${fmt(nut.capDiff)} kcal)</b>Alzalo gradualmente di 100–150 kcal a settimana per sostenere il carico.</div>` : ''}
        ${nut.macroNote ? `<div class="alert mb8">${nut.macroNote}</div>` : ''}
        <div class="macro-bar"><div class="mb-c" style="width:${cPct}%"></div><div class="mb-p" style="width:${pPct}%"></div><div class="mb-f" style="width:${fPct}%"></div></div>
        <div class="row mb8" style="justify-content:space-between;font-size:12px">
          <span><b style="color:var(--primary)">■</b> Carbo ${cPct}%</span>
          <span><b style="color:var(--corsa)">■</b> Proteine ${pPct}%</span>
          <span><b style="color:var(--z3)">■</b> Grassi ${fPct}%</span>
        </div>
        <table class="tbl">
          <tr><th>Macro</th><th class="r">Grammi</th><th class="r">g/kg</th><th class="r">Rif.</th></tr>
          <tr><td>Carboidrati</td><td class="r"><b>${nut.c} g</b></td><td class="r">${fmt(nut.c/nut.w,1)}</td><td class="r">${nut.carbRange[0]}–${nut.carbRange[1]} g/kg</td></tr>
          <tr><td>Proteine</td><td class="r"><b>${nut.p} g</b></td><td class="r">${fmt(nut.p/nut.w,1)}</td><td class="r">${fmt(nut.protGkg,1)} g/kg</td></tr>
          <tr><td>Grassi</td><td class="r"><b>${nut.f} g</b></td><td class="r">${fmt(nut.f/nut.w,1)}</td><td class="r">20–35%</td></tr>
        </table>
        ${nut.ea!=null ? `<div class="alert ${nut.ea<30?'alert-d':'alert-ok'} mt8">
          <b>Disponibilità energetica: ${fmt(nut.ea,1)} kcal/kg massa magra</b>
          ${nut.ea<30 ? 'Sotto 30 kcal/kg: rischio REDs, aumenta l\'apporto energetico.' : 'Livello adeguato.'}
        </div>` : ''}
      </div>

      <div class="card">
        <div class="card-hd"><h3>Piano pasti</h3><span class="muted">${slots.length} pasti</span></div>

        <table class="tbl mt8">
          <tr><th>Totale giorno</th><th class="r">Piano</th><th class="r">Obiettivo</th></tr>
          <tr><td>Calorie</td><td class="r"><b>${planTot.kcal}</b></td><td class="r">${nut.targetKcal} kcal</td></tr>
          <tr><td>Carboidrati</td><td class="r">${planTot.c} g</td><td class="r">${nut.c} g</td></tr>
          <tr><td>Proteine</td><td class="r">${planTot.p} g</td><td class="r">${nut.p} g</td></tr>
          <tr><td>Grassi</td><td class="r">${planTot.f} g</td><td class="r">${nut.f} g</td></tr>
          <tr><td>Fibre</td><td class="r">${planTot.fib} g</td><td class="r">25–35 g</td></tr>
        </table>
        ${hasCheat ? `<div class="alert ${Math.abs(cheatDiff)>350?'alert-w':'alert-ok'} mt8">Con il pasto sgarro sei <b>${cheatDiff>=0?'+':''}${cheatDiff} kcal</b> rispetto all'obiettivo.</div>` : ''}
      </div>
      ${duringHtml}`;
  }

  // Caffeine 7 days
  const cafDays = [];
  for(let i=6;i>=0;i--){
    const d = addDays(iso, -i);
    const v = STATE.caffeine[d] || 0;
    cafDays.push({lbl:d.slice(8)+'/'+d.slice(5,7), val:v, col:v>5?'#c8364a':v===5?'#d9a62b':'#2e8b4a'});
  }
  const cafToday = STATE.caffeine[iso] || 0;
  const cafAvg = cafDays.reduce((a,b)=>a+b.val,0)/7;
  const lastSleep = STATE.sleep.find(s=>s.date===iso);

  // Sweat
  const swAvg = calcSweatAvg();
  const swHtml = `<div class="card">
    <div class="card-hd"><h3>Quanto sudi</h3></div>
    <div class="g2 mb8">
      <div class="fld"><label>Data</label><input type="date" id="swDate" value="${iso}"></div>

      </div>
    </div>
    <button class="btn btn-p btn-sm btn-blk" onclick="addSweat()">Salva misura</button>
    ${Object.keys(swAvg.byDisc).length ? `<table class="tbl mt12">
      <tr><th>Medie (perdita ≥ 0,3 kg)</th><th class="r">Sudore (L/h)</th></tr>
      ${Object.entries(swAvg.byDisc).map(([k,v])=>`<tr><td>${DISC_INFO[k]?.lbl||k}</td><td class="r"><b>${fmt(v,2)}</b></td></tr>`).join('')}
      ${Object.entries(swAvg.byTemp).map(([k,v])=>`<tr><td>Clima ${k}</td><td class="r"><b>${fmt(v,2)}</b></td></tr>`).join('')}
    </table>`:''}
    ${STATE.sweat.length ? `<div class="mt8">${[...STATE.sweat].reverse().slice(0,8).map(s=>`
      <div class="row-sb sm" style="padding:6px 0;border-bottom:1px solid var(--border)">
        <span>${fmtDateShort(s.date)} · ${DISC_INFO[s.disc]?.lbl} (${s.temp}) · <b>${fmt(s.rate,2)} L/h</b> ${s.loss<0.3?'<span class="chip">fuori media</span>':''}</span>
        <button class="btn btn-sm" data-del="" onclick="doubleTapDel(this,'sweat','${s.id}')">✕</button>
      </div>`).join('')}</div>`:''}
  </div>`;

  return `${workoutsBox}${mainNutHtml}
    <div class="card">
      <div class="row-sb mb8">
        <div><h3 class="ft" style="font-size:20px">Caffè (${dayLbl})</h3><div class="muted">${cafToday*80} mg caffeina · Media 7 gg: ${fmt(cafAvg,1)}</div></div>

      ${cafToday>=5 ? '<div class="alert alert-d mt8">Raggiunto o superato il limite giornaliero (400 mg ≈ 5 espressi).</div>':''}
      ${lastSleep && lastSleep.hours<6 ? '<div class="alert alert-w mt8">Notte sotto le 6 ore: evita il caffè nel pomeriggio per non peggiorare il sonno stasera.</div>':''}
    </div>
    ${swHtml}`;
}

function updNutSess(path, val){
  const cur = getNutDaySessions(nutSelectedDate);
  delete cur.isManual;
  if(path==='rest') cur.rest = !!val;
  else if(path==='timing') cur.timing = val;
  else {
    const [k,sub] = path.split('.');
    cur[k][sub] = (sub==='int') ? val : (parseNum(val)||0);
  }
  STATE.nutOverrides[nutSelectedDate] = cur;
  saveState(); render();
}

function nextRecipe(iso, slotId, curId){
  const nut = calcNutrition(iso);
  const slot = buildMealSlots(nut).find(s=>s.id===slotId);
  let list = getEligibleRecipes(slot);
  if(slotId==='cena'){
    const lunchId = STATE.mealChoices[iso]?.pranzo;
    if(lunchId && list.length>1) list = list.filter(r=>r.id!==lunchId);
  }
  const idx = list.findIndex(r=>r.id===curId);
  const next = list[(idx+1)%list.length];
  STATE.mealChoices[iso] = STATE.mealChoices[iso] || {};
  STATE.mealChoices[iso][slotId] = next.id;
  saveState(); render();
}

function startCheat(iso, slotId){
  STATE.cheatMeals[iso] = STATE.cheatMeals[iso] || {};
  STATE.cheatMeals[iso][slotId] = {text:'',kcal:0,c:0,p:0,f:0,fib:0};
  saveState(); render();
}
function cancelCheat(iso, slotId){
  if(STATE.cheatMeals[iso]) delete STATE.cheatMeals[iso][slotId];
  saveState(); render();
}
function saveCheatManual(iso, slotId){
  STATE.cheatMeals[iso][slotId] = {
    text: $(`#chTxt_${slotId}`).value.trim(),
    kcal: parseNum($(`#chK_${slotId}`).value)||0,
    c: parseNum($(`#chC_${slotId}`).value)||0,
    p: parseNum($(`#chP_${slotId}`).value)||0,
    f: parseNum($(`#chF_${slotId}`).value)||0,
    fib: parseNum($(`#chFib_${slotId}`).value)||0
  };
  saveState(); render(); toast('Pasto sgarro aggiornato');
}
async function estimateCheatAI(iso, slotId){
  const txt = $(`#chTxt_${slotId}`).value.trim();
  if(!txt) return toast('Descrivi cosa hai mangiato');
  try {
    const res = await window.TRI_AI_CALL('cheat_meal', {text:txt});
    STATE.cheatMeals[iso][slotId] = {text:txt, ...res};
    saveState(); render(); toast('Valori stimati con IA');
  } catch(e){ toast('IA non disponibile: usa i campi manuali'); }
}

function addCaf(iso, d){
  STATE.caffeine[iso] = Math.max(0, (STATE.caffeine[iso]||0)+d);
  saveState(); render();
}

function calcSweatAvg(){
  const valid = STATE.sweat.filter(s=>s.loss >= 0.3);
  const byDisc={}, byTemp={};
  const group = (arr, key, out) => {
    const m={};
    arr.forEach(x=>{ (m[x[key]]=m[x[key]]||[]).push(x.rate); });
    Object.entries(m).forEach(([k,v])=> out[k] = v.reduce((a,b)=>a+b,0)/v.length);
  };
  group(valid,'disc',byDisc); group(valid,'temp',byTemp);
  return {byDisc, byTemp};
}

function addSweat(){
  const pre=parseNum($('#swPre').value), post=parseNum($('#swPost').value), drunk=parseNum($('#swDrunk').value)||0, dur=parseNum($('#swDur').value);
  if(!pre||!post||!dur) return toast('Compila pesi e durata');
  const loss = pre - post;
  const rate = Math.max(0, (loss + drunk/1000) / (dur/60));
  STATE.sweat.push({id:uid(), date:$('#swDate').value, disc:$('#swDisc').value, pre, post, drunk, dur, temp:$('#swTemp').value, loss, rate});
  saveState(); render(); toast(loss<0.3 ? 'Salvata (esclusa dalla media: < 0,3 kg)' : 'Misura sudore salvata');
}

function doubleTapDel(btn, arrKey, id){
  if(btn.dataset.del !== '1'){
    btn.dataset.del = '1'; btn.textContent = 'Conferma'; btn.classList.add('btn-d');
    setTimeout(()=>{ if(btn){ btn.dataset.del=''; btn.textContent='✕'; btn.classList.remove('btn-d'); } }, 2500);
    return;
  }
  STATE[arrKey] = STATE[arrKey].filter(x=>x.id!==id);
  saveState(); render(); toast('Elemento eliminato');
}

function renderSonno(){
  const today = todayISO();
  const sorted = [...STATE.sleep].sort((a,b)=>b.date.localeCompare(a.date));
  const last7 = sorted.slice(0,7);

function saveSleep(){

function calcWeightRate(){
  const today = todayISO();
  const pts = [...STATE.weights].filter(w=>diffDays(w.date,today)<=35 && diffDays(w.date,today)>=0).sort((a,b)=>a.date.localeCompare(b.date));
  if(pts.length < 3) return null;
  const span = diffDays(pts[0].date, pts[pts.length-1].date);
  if(span < 14) return null;
  // Linear regression x = days from first point
  const xs = pts.map(p=>diffDays(pts[0].date, p.date)), ys = pts.map(p=>p.kg);
  const mx = xs.reduce((a,b)=>a+b,0)/xs.length, my = ys.reduce((a,b)=>a+b,0)/ys.length;
  let num=0, den=0;
  for(let i=0;i<xs.length;i++){ num+=(xs[i]-mx)*(ys[i]-my); den+=(xs[i]-mx)**2; }
  if(den===0) return null;
  const kgWeek = (num/den)*7;
  const pctWeek = (kgWeek / my) * 100;
  return {kgWeek, pctWeek, count:pts.length};
}

function getShoeAutoKm(shoeId){
  let km = 0;
  for(const [d, log] of Object.entries(STATE.logs)){
    if(!log.done || log.shoeId !== shoeId) continue;
    const plan = findDayPlan(d);
    km += (plan?.type==='brick') ? (log.runKm||0) : (log.km||0);
  }
  return km;
}

          <div class="alg-grid">${ALLERGENS.map(a=>`<label class="alg-it"><input type="checkbox" class="pAlg" value="${esc(a)}" ${(p.allergens||[]).includes(a)?'checked':''}> ${esc(a)}</label>`).join('')}</div>
        </div>
        <button class="btn btn-p btn-blk mt12" onclick="saveProfile()">Salva profilo</button>
      </div>
    </div>

    <div class="card">
      <div class="card-hd"><h3>Andamento del corpo</h3></div>
      ${rems.map(r=>`<div class="alert ${r.cls} mb8">${r.txt}</div>`).join('')}

      <div class="card" style="background:var(--surface-alt);margin-bottom:8px">
        <b class="ft" style="font-size:18px;display:block;margin-bottom:6px">Peso della domenica</b>
        <div class="row">
          <div class="fld" style="flex:1"><label>Data</label><input type="date" id="wDate" value="${getSunday(today)}"></div>
          <div class="fld" style="flex:1"><label>Peso (kg)</label><input type="number" step="0.1" id="wKg" value="${lastW?lastW.kg:''}"></div>
          <button class="btn btn-p btn-sm" style="margin-top:16px" onclick="saveWeight()">Salva</button>
        </div>
        ${rateBox}
      </div>

      <div class="col-card">
        <button class="col-btn" onclick="toggleCol(this)">
          <div class="col-meta"><div class="col-t">Carica il referto della BIA</div><div class="col-s">${lastBia?`Ultima: ${fmtDateFull(lastBia.date)}`:'Foto/PDF o inserimento manuale'}</div></div>
          <span class="col-arr">▾</span>
        </button>
        <div class="col-body">
          ${hasAI() ? `<div class="fld mb8"><label>Foto o PDF del referto (lettura IA)</label><input type="file" accept="image/*,.pdf" onchange="readBiaAI(this)"></div>`
                    : `<div class="muted mb8">Inserimento manuale del referto BIA:</div>`}
          <div class="g2">
            <div class="fld"><label>Data</label><input type="date" id="bDate" value="${today}"></div>
            <div class="fld"><label>Peso (kg)</label><input type="number" step="0.1" id="bWeight" oninput="checkBiaCoh()"></div>
            <div class="fld"><label>% Grasso</label><input type="number" step="0.1" id="bFatPct" oninput="checkBiaCoh()"></div>
            <div class="fld"><label>Massa magra (kg)</label><input type="number" step="0.1" id="bLbm" oninput="checkBiaCoh()"></div>
            <div class="fld"><label>Massa musc. scheletrica</label><input type="number" step="0.1" id="bSmm" oninput="checkBiaCoh()"></div>
            <div class="fld"><label>Acqua totale (kg/L)</label><input type="number" step="0.1" id="bWater"></div>
            <div class="fld"><label>Grasso viscerale</label><input type="number" step="0.5" id="bVisc"></div>
            <div class="fld"><label>Massa grassa (kg)</label><input type="number" step="0.1" id="bFatKg"></div>
            <div class="fld"><label>Proteine (kg)</label><input type="number" step="0.1" id="bProt"></div>
            <div class="fld"><label>Minerali (kg)</label><input type="number" step="0.01" id="bMin"></div>
            <div class="fld"><label>Metabolismo basale</label><input type="number" id="bBmr"></div>
            <div class="fld"><label>IMC</label><input type="number" step="0.1" id="bBmi"></div>
            <div class="fld full"><label>Punteggio</label><input type="number" id="bScore"></div>
          </div>
          <div id="biaCohWarn" class="mt8"></div>
          <button class="btn btn-p btn-blk mt8" onclick="saveBia()">Salva BIA</button>
        </div>
      </div>

      ${mkChartCol('Peso', wPts, ' kg', wExtra)}
      ${mkChartCol('Massa grassa %', biaPts('fatPct'), '%')}
      ${mkChartCol('Massa magra', biaPts('leanMass'), ' kg')}
      ${mkChartCol('Massa muscolare scheletrica', biaPts('smm'), ' kg')}
      ${mkChartCol('Acqua corporea', biaPts('water'), ' kg')}
      ${mkChartCol('Grasso viscerale', biaPts('visceral'), '')}

      ${lastBia ? `<div class="mt12"><b class="ft" style="font-size:18px">Ultima BIA (${fmtDateFull(lastBia.date)})</b>
        <table class="tbl mt8">
          ${[['Peso',lastBia.weight,' kg'],['% Grasso',lastBia.fatPct,'%'],['Massa magra',lastBia.leanMass,' kg'],
             ['Massa musc. scheletrica',lastBia.smm,' kg'],['Acqua totale',lastBia.water,' kg'],['Grasso viscerale',lastBia.visceral,''],
             ['Massa grassa',lastBia.fatKg,' kg'],['Proteine',lastBia.protein,' kg'],['Minerali',lastBia.minerals,' kg'],
             ['Metabolismo basale',lastBia.bmr,' kcal'],['IMC',lastBia.bmi,''],['Punteggio',lastBia.score,'']]
             .filter(r=>r[1]!=null).map(r=>`<tr><td>${r[0]}</td><td class="r"><b>${fmt(r[1],1)}${r[2]}</b></td></tr>`).join('')}
        </table></div>`:''}
    </div>

    <div class="card">
      <div class="card-hd"><h3>Scarpe da corsa</h3><button class="btn btn-sm btn-p" onclick="openAddShoeModal()">+ Aggiungi</button></div>
      ${shoesHtml}
    </div>

    <div class="card">
      <div class="card-hd"><h3>Backup dati</h3></div>
      <div class="row">
        <button class="btn" style="flex:1" onclick="exportAllData()">Esporta dati (JSON)</button>
        <button class="btn" style="flex:1" onclick="triggerImportAll()">Importa dati (JSON)</button>
      </div>
    </div>`;
}

function saveProfile(){
  const p = STATE.profile;
  p.name = $('#pName').value.trim();
  p.sex = $('#pSex').value;
  p.age = parseNum($('#pAge').value);
  p.weight = parseNum($('#pWeight').value);
  p.height = parseNum($('#pHeight').value);
  p.wake = $('#pWake').value;
  p.rhr = parseNum($('#pRhr').value);
  p.maxHr = parseNum($('#pMaxHr').value);
  p.bodyFat = parseNum($('#pBf').value);
  p.leanMass = parseNum($('#pLbm').value);
  p.disciplines = $('#pDisc').value.trim();
  p.goal = $('#pGoal').value.trim();
  p.activity = parseNum($('#pAct').value)||1.3;
  p.nutGoal = $('#pNutGoal').value;
  p.hunger = $('#pHunger').value;
  p.cook = Number($('#pCook').value);
  p.mealsCount = Number($('#pMeals').value);
  p.kcalCap = parseNum($('#pCap').value);
  p.allergens = [...document.querySelectorAll('.pAlg:checked')].map(el=>el.value);
  saveState(); render(); toast('Profilo salvato');
}

function saveWeight(){
  const date=$('#wDate').value, kg=parseNum($('#wKg').value);
  if(!date||!kg) return toast('Inserisci data e peso');
  const idx = STATE.weights.findIndex(w=>w.date===date);
  if(idx>=0) STATE.weights[idx].kg = kg; else STATE.weights.push({id:uid(), date, kg});
  STATE.profile.weight = kg;
  saveState(); render(); toast('Pesata salvata');
}

function checkBiaCoh(){
  const w=parseNum($('#bWeight').value), fp=parseNum($('#bFatPct').value), lbm=parseNum($('#bLbm').value), smm=parseNum($('#bSmm').value);
  const warns=[];
  if(w && fp!=null && lbm){
    const expLbm = w*(1-fp/100);
    if(Math.abs(lbm-expLbm) > 2.5) warns.push(`Massa magra attesa ≈ ${fmt(expLbm,1)} kg (controlla i dati).`);
  }
  if(lbm && smm && smm >= lbm) warns.push('La massa muscolare scheletrica deve essere inferiore alla massa magra.');
  $('#biaCohWarn').innerHTML = warns.length ? `<div class="alert alert-w">${warns.join('<br>')}</div>` : '';
}

async function readBiaAI(input){
  const f = input.files[0]; if(!f) return;
  try {
    const res = await window.TRI_AI_CALL('bia_parse', {file:f});
    const map={weight:'bWeight',fatPct:'bFatPct',leanMass:'bLbm',smm:'bSmm',water:'bWater',visceral:'bVisc',fatKg:'bFatKg',protein:'bProt',minerals:'bMin',bmr:'bBmr',bmi:'bBmi',score:'bScore'};
    Object.entries(map).forEach(([k,id])=>{ if(res[k]!=null) $('#'+id).value = res[k]; });
    checkBiaCoh(); toast('Referto letto con IA: verifica i valori');
  } catch(e){ toast('Lettura IA non disponibile: compila a mano'); }
}

function saveBia(){
  const date = $('#bDate').value; if(!date) return toast('Inserisci la data');
  const rec = {
    id:uid(), date, weight:parseNum($('#bWeight').value), fatPct:parseNum($('#bFatPct').value),
    leanMass:parseNum($('#bLbm').value), smm:parseNum($('#bSmm').value), water:parseNum($('#bWater').value),
    visceral:parseNum($('#bVisc').value), fatKg:parseNum($('#bFatKg').value), protein:parseNum($('#bProt').value),
    minerals:parseNum($('#bMin').value), bmr:parseNum($('#bBmr').value), bmi:parseNum($('#bBmi').value), score:parseNum($('#bScore').value)
  };
  STATE.bias.push(rec);
  if(rec.weight){
    STATE.profile.weight = rec.weight;
    const wi = STATE.weights.findIndex(w=>w.date===date);
    if(wi>=0) STATE.weights[wi].kg = rec.weight; else STATE.weights.push({id:uid(), date, kg:rec.weight});
  }
  if(rec.fatPct!=null) STATE.profile.bodyFat = rec.fatPct;
  if(rec.leanMass!=null) STATE.profile.leanMass = rec.leanMass;
  saveState(); render(); toast('Referto BIA salvato');
}

function openAddShoeModal(){
  window._tmpShoePhoto = '';
  openModal(`
    <div class="modal-hd"><h2 style="font-size:22px">Nuove scarpe</h2><button class="menu-btn" onclick="closeModal()">✕</button></div>
    <div class="g2">
      <div class="fld full"><label>Modello</label><input id="shModel" placeholder="Es. Asics Novablast 4"></div>
      <div class="fld"><label>Km già fatti</label><input type="number" id="shInit" value="0"></div>
      <div class="fld"><label>Km attesi</label><input type="number" id="shExp" value="600"></div>
      <div class="fld"><label>In uso dal</label><input type="date" id="shSince" value="${todayISO()}"></div>
      <div class="fld"><label>Foto (opz.)</label><input type="file" accept="image/*" onchange="handleShoePhoto(this)"></div>
    </div>
    ${hasAI()?`<button class="btn btn-sm mt8" onclick="estimateShoeAI()">Stima durata con IA</button>`:''}
    <button class="btn btn-p btn-blk mt12" onclick="saveNewShoe()">Salva scarpe</button>
  `);
}

function handleShoePhoto(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'), max=180;
      const sc = Math.min(1, max/Math.max(img.width, img.height));
      c.width = img.width*sc; c.height = img.height*sc;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      window._tmpShoePhoto = c.toDataURL('image/jpeg', 0.72);
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
}

async function estimateShoeAI(){
  const m = $('#shModel').value.trim(); if(!m) return toast('Inserisci il modello');
  try {
    const res = await window.TRI_AI_CALL('shoe_life', {model:m});
    if(res.expectedKm) $('#shExp').value = res.expectedKm;
    toast('Durata stimata con IA');
  } catch(e){ toast('Inserisci i km attesi a mano'); }
}

function saveNewShoe(){
  const model = $('#shModel').value.trim(); if(!model) return toast('Inserisci il modello');
  STATE.shoes.push({
    id:uid(), model, initKm:parseNum($('#shInit').value)||0, expectedKm:parseNum($('#shExp').value)||600,
    since:$('#shSince').value, photo:window._tmpShoePhoto||'', retired:false
  });
  saveState(); closeModal(); render(); toast('Scarpe aggiunte');
}

function toggleShoeRetire(id){
  const s = STATE.shoes.find(x=>x.id===id);
  if(s){ s.retired = !s.retired; saveState(); render(); }
}

// Start App
initNav();
</script>
</body>
</html>
